<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>幸运会员登录 - 超级幸运大转盘</title>
<link rel="stylesheet" href="ad.css">
</head>
<body>

  <div class="top-strip"></div>

  <div class="topbar">
    <a href="index.html">返回首页</a>
  </div>

  <div class="marquee-ad">
    <span>🎉 会员登录后可查看您的专属抽奖资格与奖品详情 🎉 &nbsp;|&nbsp; 忘记账号密码请联系客服 &nbsp;|&nbsp; 活动最终解释权归主办方所有 &nbsp;|&nbsp;</span>
  </div>

  <div class="hero">
    <h1 style="font-size:30px;">★ 幸运会员登录 ★</h1>
    <p><span class="blink-tag">【会员专享】</span>登录后立即查看您的中奖记录与专属福利</p>
  </div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="badge">会员通道</div>
      <h2>会员账号验证</h2>
      <p>请输入您的会员账号与密码，验证通过即可查看专属奖品信息</p>

      <form id="login-form">
        <div class="field-row">
          <label for="login-username">会员账号</label>
          <input type="text" id="login-username" autocomplete="off">
        </div>
        <div class="field-row">
          <label for="login-password">登录密码</label>
          <input type="password" id="login-password" autocomplete="off">
        </div>
        <button type="submit" class="fake-btn-submit">立即登录</button>
      </form>

      <div class="login-error-ad" id="login-error">账号或密码错误，请重试</div>
    </div>
  </div>

  <footer class="ad-footer">
    本页面内容与任何真实商品无关，仅供娱乐展示 | © 版权所有
  </footer>

<script src="auth.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", function(event) {
    event.preventDefault();

    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value;
    const errorBox = document.getElementById("login-error");

    if (!username || !password) {
      errorBox.textContent = "请输入会员账号和密码";
      errorBox.style.display = "block";
      return;
    }

    if (login(username, password)) {
      errorBox.style.display = "none";
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get("redirect");
      window.location.href = redirect ? redirect : "portal.html";
    } else {
      errorBox.textContent = "账号或密码错误，请重试";
      errorBox.style.display = "block";
    }
  });
</script>

</body>
</html>
