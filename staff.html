<script src="auth.js"></script>
<script src="data.js"></script>
<script>
  (function renderStaffPage() {
    function initials(name) {
      return name.replace(/·/g, "").slice(-1);
    }

    function deriveContact(id) {
      const digits = id.replace(/[^0-9]/g, "");
      const ext = digits.slice(-4);
      const emailHandle = id.replace(/-/g, "").toLowerCase();
      return {
        phone: "内线 " + ext,
        email: emailHandle + "@aaa.gov"
      };
    }

    const container = document.getElementById("staff-container");
    const params = new URLSearchParams(window.location.search);
    const staffId = params.get("id");
    const person = PERSONNEL.find(p => p.id === staffId);

    if (!person) {
      container.innerHTML = '<div class="staff-locked">未找到对应的人员档案。<br><br><a href="personnel.html">返回人事名录</a></div>';
      return;
    }

    if (!isLoggedIn()) {
      const redirectUrl = "staff.html?id=" + encodeURIComponent(staffId);
      container.innerHTML =
        '<div class="staff-locked">' +
        '该档案涉及内部信息，需登录方可查看。<br><br>' +
        '<a href="login.html?redirect=' + encodeURIComponent(redirectUrl) + '">前往登录 ▶</a>' +
        '</div>';
      return;
    }

    const contact = deriveContact(person.id);

    container.innerHTML =
      '<div class="staff-profile">' +
        '<div class="staff-photo">' + initials(person.name) + '</div>' +
        '<div class="staff-name">' + person.name + '</div>' +
        '<div class="staff-position">' + person.position + '</div>' +
        '<div class="staff-info-table">' +
          '<div><span class="label">档案编号：</span>' + person.id + '</div>' +
          '<div><span class="label">在职状态：</span><span class="personnel-status status-' + person.status + '">' + person.status + '</span></div>' +
          '<div><span class="label">联系电话：</span>' + contact.phone + '</div>' +
          '<div><span class="label">电子邮箱：</span>' + contact.email + '</div>' +
        '</div>' +
      '</div>';
  })();
</script>
</body>
</html>
